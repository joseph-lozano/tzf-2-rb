[package]
name = "grid_parity"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "grid_parity"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tzf-rs = { version = "2.0.0", default-features = false, features = ["bundled"] }
