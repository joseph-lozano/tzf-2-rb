[package]
name = "tzf2"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
magnus = { version = "0.8" }
tzf-rs = { version = "2.0.0", default-features = false, features = ["bundled"] }
rb-sys = { version = "0.9", default-features = false, features = [
    "stable-api-compiled-fallback",
] }
